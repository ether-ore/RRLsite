site_name: Retirement Risk Lab
site_url: https://retirementrisklab.app/
site_description: An offline Monte Carlo retirement simulator for macOS, iPadOS, and iPhone. Fixed-seed reproducibility, Wilson confidence intervals, and full math transparency on every run.
site_author: stillward labs

repo_url: https://github.com/ether-ore/RRLsite
repo_name: ether-ore/RRLsite

copyright: Copyright &copy; stillward labs

theme:
  name: material
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - tables
  - toc:
      permalink: true
      # GitHub-compatible slugs so anchor links written for the
      # canonical User Guide (rendered on GitHub) keep working here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - User Guide: manual.md
  - Privacy: privacy.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ether-ore
